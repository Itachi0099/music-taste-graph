  <body class="bg-[#FAF9F5] text-[#161616] antialiased selection:bg-[#EAE6DF] selection:text-[#161616]">

      <noscript>
        <main style="max-width: 640px; margin: 40px auto; padding: 24px; font-family: sans-serif; line-height: 1.6; color: #161616;">
          <h1>SymphonyGraph</h1>
          <p>
            SymphonyGraph transforms your listening profile into an interactive, celestial music universe. Explore genre systems, orbiting artist planets, satellite tracks, and harmonic music discovery pathways.
          </p>
          <h2>Core Features</h2>
          <ul>
            <li><strong>Personal Celestial Universe:</strong> Visualize genres as luminous solar centers surrounded by orbiting artist systems and satellite tracks.</li>
            <li><strong>Living Spotify Integration:</strong> Connect Spotify to map real-time playback, recently played events, and personal audio profiles.</li>
            <li><strong>Harmonic Discovery:</strong> Uncover adjacent genres, bridge artists, and recommendations calibrated to your personal listening gravity.</li>
            <li><strong>Classic Graph View:</strong> Switch seamlessly to interactive node networks with tempo, mood, and genre filtering.</li>
          </ul>
          <p><em>JavaScript is required to navigate the interactive universe canvas and audio visualizer.</em></p>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
